services:
  - type: web
    name: devops-proj
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: -Xms64m -Xmx384m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
