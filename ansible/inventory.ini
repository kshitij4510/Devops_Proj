# AgriRent DevOps Inventory
[production]
prod-app-01 ansible_host=127.0.0.1 ansible_connection=local app_port=8085 app_env=prod

[staging]
staging-app-01 ansible_host=127.0.0.1 ansible_connection=local app_port=8086 app_env=staging

[agrirent_servers:children]
production
staging

[agrirent_servers:vars]
ansible_user=administrator
app_name=farm-equipment-rental
app_version=1.0.0
app_root_dir=/opt/agrirent
java_package=temurin-21-jdk
maven_version=3.9.16
service_name=agrirent
