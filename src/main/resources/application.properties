# AgriRent Farm Equipment Rental System Configuration
server.port=8085

# Spring Application Metadata
spring.application.name=farm-equipment-rental
server.servlet.context-path=/

# Management & Health Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.agrirent=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Release Configuration (Feature Branch Version)
app.release.tier=feature-rental-workflow-v1.0.0
app.dashboard.refresh.interval.ms=10000
